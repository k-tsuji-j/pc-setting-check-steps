<iframe id="pc-check" title="PC設定確認ステップ（Windows版）" src="https://k-tsuji-j.github.io/pc-setting-check-steps/v2/embed.html" style="display:block;width:100%;max-width:780px;height:800px;margin:0 auto;border:0" allow="fullscreen"></iframe>
<script>(function(){var frame=document.getElementById('pc-check');function viewport(){if(frame.contentWindow)frame.contentWindow.postMessage({type:'pc-check-viewport',height:window.innerHeight},'*');}window.addEventListener('message',function(event){if(event.source!==frame.contentWindow)return;var data=event.data||{};if(data.type==='pc-check-height'&&isFinite(data.height)&&data.height>100&&data.height<100000){frame.style.height=Math.ceil(data.height)+'px';}if(data.type==='pc-check-top'){if(frame.getBoundingClientRect().top<0)frame.scrollIntoView({block:'start'});}if(data.type==='pc-check-ask-viewport')viewport();});window.addEventListener('resize',viewport);frame.addEventListener('load',function(){viewport();if(frame.contentWindow)frame.contentWindow.postMessage({type:'pc-check-measure'},'*');});viewport();})();</script>
