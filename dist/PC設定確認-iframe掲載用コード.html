<iframe id="pc-check" title="PC設定確認ステップ（Windows版）" src="https://k-tsuji-j.github.io/pc-setting-check-steps/v2/embed.html" style="display:block;width:100%;max-width:780px;height:1100px;margin:0 auto;border:0" allow="fullscreen"></iframe>
<script>(function(){var frame=document.getElementById('pc-check');window.addEventListener('message',function(event){if(event.source!==frame.contentWindow)return;var data=event.data||{};if(data.type==='pc-check-height'&&isFinite(data.height)&&data.height>100&&data.height<100000){frame.style.height=Math.ceil(data.height)+'px';}if(data.type==='pc-check-top'){var top=frame.getBoundingClientRect().top;if(top<0)frame.scrollIntoView({block:'start'});}});function measure(){if(frame.contentWindow)frame.contentWindow.postMessage({type:'pc-check-measure'},'*');}frame.addEventListener('load',measure);measure();})();</script>
